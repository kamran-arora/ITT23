[project]
name = "itt23"
version = "0.1.0"
description = "description"
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "equinox>=0.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["itt23/*"]

[tool.ruff.lint]
unfixable = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true